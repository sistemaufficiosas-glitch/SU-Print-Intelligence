[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "su-print-counters"
version = "1.1.0"
description = "Centro Raccolta Contatori indipendente per SU Print Intelligence"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
su-print-counters = "su_print_counters.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
